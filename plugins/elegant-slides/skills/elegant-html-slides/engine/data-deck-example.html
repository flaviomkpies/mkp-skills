<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scaffold data-driven — exemplo</title>
<style>
  /* ── Mondoré (paleta oficial) ─────────────────────────────────────────── */
  :root{
    --ink:#102F37; --teal:#006782; --aqua:#00AFAA; --orange:#F68C36;
    --paper:#faf8f3; --muted:#6b7a80; --line:#e3ded3;
    --font:Tahoma,"Segoe UI",system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;font-family:var(--font)}
  .deck-viewport{position:fixed;inset:0;overflow:hidden}
  .deck-stage{position:absolute;top:0;left:0;width:1920px;height:1080px;transform-origin:top left}
  .slide{position:absolute;inset:0;width:1920px;height:1080px;background:var(--paper);
         color:var(--ink);padding:0;visibility:hidden;opacity:0;transition:opacity .25s}
  .slide.active{visibility:visible;opacity:1}
  /* chrome comum: tracker, confidencial, título, subtítulo, rodapé */
  .trk{position:absolute;top:46px;left:120px;font-size:18px;letter-spacing:.12em;
       text-transform:uppercase;color:var(--teal);font-weight:700}
  .conf{position:absolute;top:46px;right:120px;font-size:15px;color:var(--muted)}
  .title{position:absolute;top:120px;left:120px;max-width:1640px;font-size:46px;
         line-height:1.18;font-weight:700;color:var(--ink)}
  .subt{position:absolute;top:222px;left:120px;max-width:1640px;font-size:24px;
        line-height:1.35;color:var(--teal)}
  .foot{position:absolute;bottom:44px;left:120px;right:120px;font-size:14px;color:var(--muted)}
  /* componentes de conteúdo */
  .kpi{position:absolute;left:120px;width:520px;padding:34px 40px;border-radius:14px;
       background:#fff;border:1px solid var(--line)}
  .kpi .lbl{font-size:20px;color:var(--muted)}
  .kpi .val{font-size:64px;font-weight:700;color:var(--teal);margin-top:8px}
  table{border-collapse:collapse;font-size:26px}
  thead th{color:var(--muted);font-weight:600;text-align:right;padding:14px 26px;
           border-bottom:2px solid var(--line)}
  thead th:first-child{text-align:left}
  tbody td{text-align:right;padding:14px 26px;border-bottom:1px solid var(--line)}
  tbody td:first-child{text-align:left;font-weight:600}
  .cap-title{position:absolute;top:380px;left:120px;font-size:78px;font-weight:700;color:var(--ink)}
  .cap-sub{position:absolute;top:500px;left:120px;font-size:30px;color:var(--teal)}
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage">

  <!-- #0 capa: tudo populado por DATA via renderAll (sem número escrito à mão) -->
  <section class="slide title-slide">
    <div class="trk">Confidencial</div>
    <div class="cap-title" id="cap-co"></div>
    <div class="cap-sub" id="cap-sub"></div>
    <div class="kpi" style="top:640px"><div class="lbl">EBITDA do último ano projetado</div><div class="val" id="cap-ebitda"></div></div>
  </section>

  <!-- #1 tabela receita/EBITDA por ano -->
  <section class="slide">
    <div class="trk">01 · Projeção</div>
    <div class="conf">Confidencial</div>
    <h2 class="title" id="t1-title"></h2>
    <div class="subt" id="t1-subt"></div>
    <!-- conteúdo curto → ancorar INFERIOR (regra do container, não flutuar no topo) -->
    <div style="position:absolute;bottom:130px;left:120px">
      <table><thead><tr id="t1-head"></tr></thead><tbody id="t1-body"></tbody></table>
    </div>
    <div class="foot" id="t1-foot"></div>
  </section>

  <!-- #2 gráfico de barras (receita por ano) -->
  <section class="slide">
    <div class="trk">02 · Receita</div>
    <div class="conf">Confidencial</div>
    <h2 class="title" id="t2-title"></h2>
    <div class="subt" id="t2-subt"></div>
    <div style="position:absolute;top:320px;left:120px;width:1680px">
      <svg id="t2-svg" viewBox="0 0 1680 620" width="1680" height="620"></svg>
    </div>
    <div class="foot" id="t2-foot"></div>
  </section>

</main>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   DATA — FONTE ÚNICA DA VERDADE. Gerado do modelo Excel por scripts/model-to-data.py
   (aba DECK). Mude no MODELO e re-rode; renderAll() propaga em título, KPI, tabela e
   gráfico. Nenhum literal numérico vive no HTML acima. Os marcadores abaixo delimitam
   o bloco que o extrator reescreve — não mexa neles.
   ═══════════════════════════════════════════════════════════════════════════ */
/* DATA:START — gerado por model-to-data.py a partir do modelo; edite o MODELO, não aqui */
const DATA = {
  years: ["2025", "2026E", "2027E", "2028E"],
  company: "Antares (exemplo)",
  fonte: "Mondoré · modelo de exemplo (dados fictícios)",
  receita: [31.6, 38.2, 42.1, 45.2],
  ebitda: [6.1, 11, 12.2, 14.7],
};
/* DATA:END */

/* helpers de formato — único lugar que decide como número vira texto */
const m  = (v) => "R$" + v.toFixed(1).replace(".", ",") + "M";
const last = (a) => a[a.length - 1];
// até o VERBO do action-title sai do dado — senão a frase ("mais que dobra") vira stale
const tend = (a) => { const r = last(a) / a[0]; return r >= 2 ? "mais que dobra" : r > 1 ? "cresce" : "recua"; };

/* ── funções de componente: cada uma lê DATA, nenhuma recebe número cravado ── */
function renderCapa() {
  document.getElementById("cap-co").textContent     = DATA.company;
  document.getElementById("cap-sub").textContent    = "Business plan, " + DATA.years[0] + " a " + last(DATA.years);
  document.getElementById("cap-ebitda").textContent = m(last(DATA.ebitda));
}

function renderTabela() {
  document.getElementById("t1-title").textContent =
    "A receita " + tend(DATA.receita) + " de " + m(DATA.receita[0]) + " a " + m(last(DATA.receita)) + " no horizonte do plano";
  document.getElementById("t1-subt").textContent  = "Receita e EBITDA por ano, em R$ milhões";
  document.getElementById("t1-head").innerHTML =
    "<th>Linha</th>" + DATA.years.map((y) => "<th>" + y + "</th>").join("");
  const row = (nome, serie) =>
    "<tr><td>" + nome + "</td>" + serie.map((v) => "<td>" + m(v) + "</td>").join("") + "</tr>";
  document.getElementById("t1-body").innerHTML = row("Receita", DATA.receita) + row("EBITDA", DATA.ebitda);
  document.getElementById("t1-foot").textContent = "Fonte: " + DATA.fonte;
}

function renderGrafico() {
  document.getElementById("t2-title").textContent =
    "O EBITDA " + tend(DATA.ebitda) + " de " + m(DATA.ebitda[0]) + " a " + m(last(DATA.ebitda));
  document.getElementById("t2-subt").textContent = "Receita bruta por ano, em R$ milhões";
  document.getElementById("t2-foot").textContent = "Fonte: " + DATA.fonte;
  // barras: altura, rótulo, escala e eixo SAEM TODOS de DATA.receita (uma fonte → sem stale)
  const W = 1680, H = 620, base = 540, top = 40, max = Math.max(...DATA.receita);
  const n = DATA.receita.length, slot = W / n, bw = 180;
  let svg = "";
  DATA.receita.forEach((v, i) => {
    const h = (v / max) * (base - top);
    const x = i * slot + (slot - bw) / 2, y = base - h;
    svg += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + h + '" rx="6" fill="var(--aqua)"/>';
    svg += '<text x="' + (x + bw / 2) + '" y="' + (y - 16) + '" text-anchor="middle" font-size="30" font-weight="700" fill="var(--ink)">' + m(v) + '</text>';
    svg += '<text x="' + (x + bw / 2) + '" y="' + (base + 40) + '" text-anchor="middle" font-size="24" fill="var(--muted)">' + DATA.years[i] + '</text>';
  });
  document.getElementById("t2-svg").innerHTML = svg;
}

function renderAll() { renderCapa(); renderTabela(); renderGrafico(); }

/* ── controller (igual ao html-template, + window.deck.show p/ testes/nav) ── */
class SlidePresentation {
  constructor() {
    this.slides = document.querySelectorAll(".slide");
    this.stage = document.getElementById("deckStage");
    this.i = 0;
    this.scale(); addEventListener("resize", () => this.scale());
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") this.show(this.i + 1);
      if (e.key === "ArrowLeft") this.show(this.i - 1);
    });
    this.show(0);
  }
  scale() {
    const f = Math.min(innerWidth / 1920, innerHeight / 1080);
    this.stage.style.transform = "scale(" + f + ")";
  }
  show(n) {
    this.i = Math.max(0, Math.min(n, this.slides.length - 1));
    this.slides.forEach((s, k) => s.classList.toggle("active", k === this.i));
  }
}

renderAll();                              // popula tudo de DATA antes de mostrar
window.deck = new SlidePresentation();
</script>
</body>
</html>
